name: Registry outcome discrepancy evidence tests
on:
  push:
  pull_request:
jobs:
  scientific-and-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest requests numpy scipy scikit-learn
      - run: python -m compileall -q src
      - name: Offline regression tests
        run: python -m pytest tests/test_all.py tests/test_stats.py tests/test_registry_contract.py -q
      - name: Live CT.gov completed-with-results query
        run: python -m pytest tests/test_live_contract.py -q -s
